name: Java CI with Gradle

on:
  push:
    branches: [ "main", "ana" ]
  pull_request:
    branches: [ "main", "ana" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Build with Gradle
      run: ./gradlew build
    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: FabricMod
        path: build/libs/*.jar
